site_name: Avrana Party Docs
site_description: >-
  Human-readable documentation for Avrana Party, a portable, local-first
  multiplayer appliance where phones are the screens and the controllers.
# Published with GitHub Pages (see README, "Publishing"). Change this if the site moves,
# for example to a custom domain such as https://docs.avrana.net/.
site_url: https://rcnechamkin.github.io/avrana-party-docs/
# The header links to the engineering repository the site explains, not to this one.
repo_name: avrana-party (engineering)
repo_url: https://github.com/rcnechamkin/avrana-party
edit_uri: ""

hooks:
  - hooks/sources.py
copyright: >-
  Explanatory documentation. The engineering repositories remain the
  authority for every contract, guarantee and decision described here.

theme:
  name: material
  language: en
  logo: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

extra_css:
  - assets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: !relative $config_dir
      check_paths: true
      auto_append:
        - includes/abbreviations.md
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# Fail the strict build on broken internal links and anchors.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Overview:
      - What Avrana Party is: introduction/index.md
      - Why phones, and only phones: introduction/phone-first.md
      - What exists, and what is planned: introduction/today-and-vision.md
      - What works today: status/index.md
  - Architecture:
      - architecture/index.md
      - The appliance and its network: architecture/appliance-and-network.md
      - The Party: architecture/party.md
      - Game sessions: architecture/game-sessions.md
      - Trust boundaries: architecture/trust-boundaries.md
  - Games:
      - games/index.md
      - Execution models: games/execution-models.md
      - Contracts, catalog and grants: games/contracts-and-catalog.md
      - Native games and SDK status: games/native-games.md
      - Designing for phones: games/designing-for-phones.md
      - Building or porting a game today: developers/starting-a-game.md
      - The reference games, explained: developers/reference-games.md
  - Developers:
      - developers/index.md
      - Repository ecosystem: developers/ecosystem.md
      - Local development: developers/local-development.md
      - Testing: developers/testing.md
      - Contributing: developers/contributing.md
  - Reference:
      - reference/index.md
      - Decision records:
          - decisions/index.md
          - "0001: Load, soak and fault harness": decisions/0001-load-soak-fault-harness.md
          - "0002: Avrana Party is a party platform": decisions/0002-party-platform.md
          - "0003: Identifiers and credentials": decisions/0003-ids-and-keys.md
          - "0004: Full Mode origin, contracts and providers": decisions/0004-full-mode-contracts-and-providers.md
          - "0005: LAN Games as a provider": decisions/0005-lan-games-provider-launch.md
          - "0006: Party Core and the session protocol": decisions/0006-party-session-protocol.md
          - "0007: The host starts the game": decisions/0007-host-authoritative-launch.md
          - "0008: Party navigation": decisions/0008-party-navigation.md
          - "0009: The arcade is a Party-launched game": decisions/0009-arcade-party-provider.md
          - "0010: The Party's pregame": decisions/0010-party-pregame.md
          - "0011: The console model": decisions/0011-party-console-model.md
          - "0012: Limited Mode": decisions/0012-limited-mode-party-survives-https-loss.md
          - "0013: Separate browser origins": decisions/0013-party-and-game-browser-origins.md
          - "0014: Isolated native games": decisions/0014-native-games-isolated-lan-games-retired.md
          - "0015: Game result envelope": decisions/0015-game-result-envelope.md
          - "0016: Service identities": decisions/0016-service-identities-and-local-trust-boundary.md
      - Design documents:
          - design/index.md
          - Party platform design: design/party-platform.md
          - Party lifecycle: design/party-lifecycle.md
          - Limited Mode: design/limited-mode.md
          - Browser origins: design/browser-origins.md
          - The game UX contract: design/game-ux-contract.md
          - Accessibility: design/accessibility.md
      - Navigating the engineering docs: developers/reading-the-specs.md
      - Glossary: about/glossary.md
  - Project:
      - Roadmap: project/roadmap.md
      - Deployed system and history: project/system-map.md
      - Deployment: project/deployment.md
      - Known discrepancies: status/discrepancies.md
      - About this documentation: about/this-documentation.md
