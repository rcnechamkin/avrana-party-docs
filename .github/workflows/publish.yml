name: Publish

# Manual only. Publishing the site is an authorized human decision, never a side effect of a
# merge. Before first use: set site_url in mkdocs.yml, set Pages to "GitHub Actions" in the
# repository settings, and give the github-pages environment required reviewers and a
# deployment-branch rule allowing only main.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Publish only what has been reviewed and merged.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refuse to publish without a site_url
        run: |
          if ! grep -Eq '^site_url:[[:space:]]*[^[:space:]#]' mkdocs.yml; then
            echo "::error::Set site_url in mkdocs.yml before publishing."
            exit 1
          fi
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
